name: Container Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  container-build-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Pre-AWS verification only.
      # This workflow proves container portability before any ECR/ECS work begins.
      # No secrets are required and no image is pushed anywhere.
      - name: Build local verification image
        run: docker build -f docker/Dockerfile -t task-planner-foundation:test .

      - name: Run local verification container
        run: |
          docker run -d --rm \
            --name task-planner-foundation-test \
            -p 18081:8081 \
            task-planner-foundation:test

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy in time." >&2
          docker logs task-planner-foundation-test || true
          exit 1

      - name: Smoke test foundation endpoints
        run: |
          curl -fsS http://127.0.0.1:18081/health
          curl -fsS http://127.0.0.1:18081/validate
          curl -fsS http://127.0.0.1:18081/orchestrate

      - name: Show container logs on failure
        if: failure()
        run: docker logs task-planner-foundation-test || true

      - name: Remove verification container
        if: always()
        run: docker rm -f task-planner-foundation-test || true
